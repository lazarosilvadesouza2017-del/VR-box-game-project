
name: Build VR Box Games APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar projeto atualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh release download v2-source \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'VR-Box-Games-revisao-taxi-e-otimizacao.zip' \
            --dir source

          unzip -q source/VR-Box-Games-revisao-taxi-e-otimizacao.zip -d source

          echo "Arquivos extraídos:"
          ls -lah source

          PROJECT_DIR="$(find source -name gradlew -type f -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Não encontrei o gradlew dentro do ZIP."
            exit 1
          fi

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar interface
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"
          npm ci
          npm run build:ui

      - name: Instalar ferramentas Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Construir APK
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :nextvr-android:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Box-Games-APK-Atualizado
          path: source/**/nextvr-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

